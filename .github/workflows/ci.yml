name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nimnear
          POSTGRES_PASSWORD: nimnear
          POSTGRES_DB: nimnear_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimnear -d nimnear_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      NIMNEAR_TEST_DATABASE_URL: postgres://nimnear:nimnear@localhost:5432/nimnear_test?sslmode=disable
      NIMNEAR_TEST_DB_ISOLATED: "true"
      NIMNEAR_EMAIL_AUTH_ENABLED: "false"
      NIMNEAR_PLATFORM_API_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Apply migrations to a fresh database
        run: goose -dir internal/infrastructure/postgres/migrations postgres "$NIMNEAR_TEST_DATABASE_URL" up
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -count=1 ./...

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    env:
      NEXT_PUBLIC_NIMNEAR_API_URL: http://localhost:8080
      NEXT_PUBLIC_NIMNEAR_NIMIQ_NETWORK: test-albatross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
